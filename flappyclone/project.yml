name: PulseScout
options:
  bundleIdPrefix: com.pulsescout
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
targets:
  PulseScout:
    type: application
    platform: iOS
    sources:
      - path: PulseScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsescout.app
        PRODUCT_NAME: PulseScout
        INFOPLIST_KEY_CFBundleDisplayName: PulseScout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: PulseScout/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - PulseScoutTests
  PulseScoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseScoutTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsescout.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PulseScout
