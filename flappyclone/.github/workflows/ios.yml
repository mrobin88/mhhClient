name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Build and Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: |
          xcodebuild \
            -project PulseScout.xcodeproj \
            -scheme PulseScout \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test
        run: |
          xcodebuild \
            -project PulseScout.xcodeproj \
            -scheme PulseScout \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
